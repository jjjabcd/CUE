name: cue4modal
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9.19
  - gxx_linux-64
  - gcc_linux-64
  - make
  - nvidia::libcublas
  - pytorch::pytorch=1.12.1=*cuda11.6*
  - pytorch::torchvision
  - pytorch::torchtext=0.5.0
  - scikit-learn=1.3.2
  - sympy=1.13.1
  - transformers=4.46.3
  - tokenizers=0.20.0
  - gensim=4.3.3
  - sentencepiece=0.1.99
  - sentencepiece-spm=0.1.99
  - pillow=11.1.0
  - scikit-image=0.24.0
  - openbabel=3.1.1
  - rdkit=2023.03.3
  - tensorboard
  - tensorboardx
  - numpy=1.26.4
  - gsd=3.3.1
  - mkl=2023.2.0
  - jupyter
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - umap-learn
  - openeye::openeye-toolkits
  - bioconda::smina=2017.11.9
  - bioconda::reduce
  - hydra-core=1.2.0
  - omegaconf=2.2.*
  - pip
  - pip:
    - tqdm
    - xgboost
    - dask
    - prolif
    - rdkit==2023.3.3
    - molbloom
    - gensim==4.3.3
    - molscore
    - sentencepiece==0.1.99
    - SmilesPE==0.0.3
    - OpenNMT-py==2.2.0
    - albumentations==1.1.0
    - timm==0.5.4
    # --- GNN (MolE) ---
    # NOTE: pytorch-lightning>=2.x requires torch>=2.1 (imports torch.optim.lr_scheduler.LRScheduler,
    # which doesn't exist in torch 1.12.1) and would silently upgrade/break the pinned
    # torch==1.12.1+cu116 this env is built around. Pinned to the last 1.x line instead,
    # verified working against torch 1.12.1. Install with --no-deps to avoid pip's resolver
    # pulling in a newer torch anyway.
    - torch-geometric
    - pytorch-lightning==1.9.5
    - torchmetrics==0.11.4
    - lightning-utilities==0.8.0
    - onnxruntime-gpu==1.19.2
    - onnx==1.17.0
    # --- Conformation (ConforFormer / Uni-Mol) ---
    - lmdb>=1.4.1
    - scikit-learn-extra
    # `DeBERTa` (needed by cue/mole's model code) is also NOT listed as a plain
    # entry: pip's normal resolve pulls in its `spacy`/`nltk` extras, and spacy's
    # `thinc` build fails on this Python/toolchain. We only need
    # `DeBERTa.deberta.config.ModelConfig`, so install with --no-deps:
    #   pip install --no-deps DeBERTa
    # `unicore` (Uni-Core) is intentionally NOT listed as a plain pip entry here:
    # a bare `pip install` always tries to build its optional fused CUDA kernels
    # and fails hard without nvcc/CUDA_HOME (this env has no CUDA toolkit, only
    # the conda `libcublas` runtime lib). The upstream `stable` branch referenced
    # by some ConforFormer docs no longer exists either. Verified working install
    # (Python-only, pure-PyTorch fallbacks for the fused ops) in this env:
    #   git clone --branch torch1.x https://github.com/dptech-corp/Uni-Core.git
    #   cd Uni-Core && python setup.py install --disable-cuda-ext